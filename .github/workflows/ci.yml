name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build better-sqlite3 for the runner's Node
        # --ignore-scripts skips the native build; DB-backed tests need it.
        run: npm rebuild better-sqlite3
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        if: ${{ !cancelled() }}
        run: npm test
        env:
          # keeps require("electron") from throwing when postinstall was skipped
          ELECTRON_OVERRIDE_DIST_PATH: /tmp
          # fail instead of silently skipping DB tests when the rebuild is missing
          REQUIRE_DB_TESTS: "1"
