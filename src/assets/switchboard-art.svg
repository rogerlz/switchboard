<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23345F"/>
      <stop offset="1" stop-color="#0E1631"/>
    </linearGradient>
    <radialGradient id="jack" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#0A1026"/>
      <stop offset="1" stop-color="#050914"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- four jacks -->
  <g fill="url(#jack)" stroke="#EDE6D6" stroke-width="30">
    <circle cx="352" cy="352" r="96"/>
    <circle cx="672" cy="352" r="96"/>
    <circle cx="352" cy="672" r="96"/>
    <circle cx="672" cy="672" r="96"/>
  </g>
  <!-- patch cable: top-left to bottom-right, drooping -->
  <path d="M352 352 C 380 610, 560 470, 672 672" fill="none" stroke="#0A1026" stroke-opacity="0.45" stroke-width="84" stroke-linecap="round" transform="translate(0 14)"/>
  <path d="M352 352 C 380 610, 560 470, 672 672" fill="none" stroke="#F5A524" stroke-width="64" stroke-linecap="round"/>
  <g fill="#F5A524">
    <circle cx="352" cy="352" r="50"/>
    <circle cx="672" cy="672" r="50"/>
  </g>
  <g fill="#FFD27A">
    <circle cx="336" cy="334" r="14"/>
    <circle cx="656" cy="654" r="14"/>
  </g>
</svg>
